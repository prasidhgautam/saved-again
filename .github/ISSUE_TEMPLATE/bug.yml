name: Bug report
description: Report a reproducible SavedAgain problem using synthetic or redacted data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not upload real captions, thumbnails, source reels, transcripts, account identifiers, access keys, Cloudflare secrets or `.env` files. Security issues belong in a private security advisory."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use only synthetic records or a minimal fixture.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `savedagain.py doctor --json` after checking that paths or identifiers are redacted.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirmed this report contains no personal library data, credentials, real Instagram media or account identifiers.
          required: true
