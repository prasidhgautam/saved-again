name: Feature request
description: Propose an improvement that preserves SavedAgain's privacy and platform boundaries.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What personal-use workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This request does not require cookie extraction, a private Instagram API, automated reel downloading or uploading raw analysis artifacts to the cloud.
          required: true
