name: Publish tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r skills/saved-again/assets/dashboard/backend/requirements-dev.txt
      - name: Run Python tests
        run: |
          python -m pytest tests -q
          (cd skills/saved-again/assets/dashboard && python -m pytest tests/backend -q)
      - name: Build and test dashboard
        working-directory: skills/saved-again/assets/dashboard
        run: |
          npm ci
          npm run build
          npm run test:sites
          npm run cloud:dry-run
      - name: Audit all Git history
        run: |
          python scripts/audit_history.py
          curl -fsSLo /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --verbose
      - name: Build curated release archives
        run: python scripts/build_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
