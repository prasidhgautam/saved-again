name: Check skill and dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/saved-again/assets/dashboard/backend/requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/audit_history.py
      - run: python -m pytest tests/backend -q
        working-directory: skills/saved-again/assets/dashboard
      - run: npm ci
        working-directory: skills/saved-again/assets/dashboard
      - run: npm run build
        working-directory: skills/saved-again/assets/dashboard
      - run: npm run test:sites
        working-directory: skills/saved-again/assets/dashboard
      - run: python scripts/build_release.py
