name: Check skill and dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/saved-again/assets/dashboard/backend/requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/audit_history.py
      - run: python -m pytest tests/backend -q
        working-directory: skills/saved-again/assets/dashboard
      - run: npm ci
        working-directory: skills/saved-again/assets/dashboard
      - run: npm run build
        working-directory: skills/saved-again/assets/dashboard
      - run: npm run test:sites
        working-directory: skills/saved-again/assets/dashboard
      - run: python scripts/build_release.py
